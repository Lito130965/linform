name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install WeasyPrint native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core fonts-liberation
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Audit dependencies
        # Advisory: a new CVE against a pinned dependency should be visible on
        # the next run, but it must not block an unrelated pull request.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --strict --desc

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Unit tests (jinja-bridge)
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: Audit dependencies
        # Advisory, same reasoning as the backend audit: surface new advisories
        # without failing a pull request that did not introduce them.
        continue-on-error: true
        run: npm audit --audit-level=high
