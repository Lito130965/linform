name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push makes the previous run's answer irrelevant; letting it finish just
# holds a runner and delays the answer that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # The concurrency invariants live in the database (a unique constraint on
      # the version number, a partial unique index for "one published version"),
      # so they have to be exercised against PostgreSQL — partial-index and
      # locking semantics differ from SQLite, and PostgreSQL is the target.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linform
          POSTGRES_PASSWORD: linform
          POSTGRES_DB: linform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LINFORM_TEST_PG_URL: "postgresql+asyncpg://linform:linform@localhost:5432/linform_test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install WeasyPrint native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core fonts-liberation
      - name: Install project
        # -c constraints.txt: the exact versions this commit was tested with.
        # Without it the job resolves to whatever PyPI published this morning,
        # and an upstream release lands as a failure on an unrelated pull
        # request — which is how the snapshot check below first went red.
        run: pip install -e ".[dev]" -c constraints.txt
      - name: Run tests
        run: pytest -q
      - name: API schema matches its snapshot
        # An API change made in passing is invisible in a router diff; the
        # snapshot puts it where a reviewer has to agree with it.
        run: python -m scripts.openapi_snapshot --check
      - name: Concurrent migrations are serialised
        # Replicas start together and every container runs `alembic upgrade
        # head`. Without the advisory lock they race to apply the same revision;
        # this proves the lock rather than trusting the comment next to it.
        env:
          LINFORM_DATABASE_URL: "postgresql+asyncpg://linform:linform@localhost:5432/linform_concurrent"
        run: |
          PGPASSWORD=linform createdb -h localhost -U linform linform_concurrent
          pids=""
          for _ in 1 2 3 4; do
            alembic upgrade head &
            pids="$pids $!"
          done
          failed=0
          for p in $pids; do wait "$p" || failed=1; done
          [ "$failed" = "0" ] || { echo "a concurrent migration run failed"; exit 1; }
          alembic current | grep -q "(head)" || { echo "not at head after the race"; exit 1; }
          # And the schema is actually THERE. Taking the lock on the migration
          # connection once made alembic commit into an inner transaction, so
          # every revision was applied and then rolled back when the connection
          # closed — which reads, in the log, exactly like a successful upgrade.
          PGPASSWORD=linform psql -h localhost -U linform -d linform_concurrent \
            -tAc "select count(*) from templates" >/dev/null \
            || { echo "migrations reported success but left no schema"; exit 1; }
          alembic downgrade base

      - name: Migrations are reversible
        # Every revision ships a downgrade(); running one proves it. Without
        # this the rollback path is only ever exercised during an incident.
        env:
          LINFORM_DATABASE_URL: "sqlite+aiosqlite:///./ci_migrations.db"
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          rm -f ci_migrations.db
      - name: Audit dependencies
        # Advisory: a new CVE against a pinned dependency should be visible on
        # the next run, but it must not block an unrelated pull request.
        continue-on-error: true
        run: |
          pip install pip-audit
          # --skip-editable: the project itself is installed with `pip install -e`
          # and is not on PyPI, so auditing it fails with "Dependency not found
          # on PyPI" on every single run.
          # No --strict: it fails the step for anything that could not be
          # audited — including the editable install we just chose to skip — so
          # the audit would be permanently red and therefore report nothing.
          # Measured: clean tree exits 0, a real advisory still exits non-zero.
          pip-audit --desc --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Unit tests (jinja-bridge)
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: Lint (accessibility rules)
        # Blocking as of the batch that fixed the findings. It stays blocking:
        # an accessibility regression is cheap to catch here and expensive to
        # notice by hand.
        run: npm run lint
      - name: Audit dependencies
        # Advisory, same reasoning as the backend audit: surface new advisories
        # without failing a pull request that did not introduce them.
        continue-on-error: true
        run: npm audit --audit-level=high

  e2e:
    # Browser tests against the BUILT IMAGE, so what is exercised is the bundle,
    # the service and the CSP headers that actually ship — not a dev server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the image
        run: docker build -t linform:latest .
      - name: Install browser test dependencies
        working-directory: e2e
        run: |
          # npm ci, not install: the Playwright package version has to stay
          # exactly what the installed browsers below expect.
          npm ci --no-audit --no-fund
          # Chromium only: the editor targets one engine, as stated in README.
          npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: e2e
        env:
          E2E_IN_CONTAINER: "1" # browsers are on the runner already
        run: ./run.sh --no-build
      - name: A split, multi-replica deployment holds up
        # Reuses the image built above. Checks what only exists once there is
        # more than one process: concurrent migrations, a render node with no
        # management API, and how long a rollback takes to reach every replica.
        run: ./scripts/verify-scale.sh 3

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7

  publish:
    # Push a versioned image on a tag, so `docker run ghcr.io/...` works without
    # cloning. Gated on the full suite: a tag that fails CI never becomes an
    # image somebody can pull.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
